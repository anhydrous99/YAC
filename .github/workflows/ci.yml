name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep wget gnupg lsb-release software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-21 clang-tidy-21 clang-tools-21

      - name: Build
        run: bazel build //src:yac

      - name: Test
        run: bazel test //tests:all_tests

      - name: Format check
        run: bazel test //tools:format_check

      - name: Lint
        run: bazel run //tools:lint

  coverage:
    name: PR coverage (gated)
    if: github.event_name == 'pull_request'
    needs: linux
    runs-on: ubuntu-latest
    environment: coverage-approval
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep lcov

      - name: Run coverage
        run: bazel run //tools:coverage

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: bazel-out/_coverage/_coverage_report.dat
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Install build dependencies
        run: |
          brew install llvm ripgrep
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          ln -sf /opt/homebrew/opt/llvm/bin/clang-format /opt/homebrew/opt/llvm/bin/clang-format-21
          ln -sf /opt/homebrew/opt/llvm/bin/clang-tidy /opt/homebrew/opt/llvm/bin/clang-tidy-21
          ln -sf /opt/homebrew/opt/llvm/bin/run-clang-tidy /opt/homebrew/opt/llvm/bin/run-clang-tidy-21 || true

      - name: Build
        run: bazel build //src:yac

      - name: Test
        run: bazel test //tests:all_tests
        env:
          YAC_KEYCHAIN_DISABLED: "1"

      - name: Format check
        run: bazel test //tools:format_check

      - name: Lint
        run: bazel run //tools:lint
