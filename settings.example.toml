# YAC configuration.
#
# On first launch, YAC writes this file to ~/.yac/settings.toml. This copy
# under the repo root is for reference. To reset your configuration, remove
# ~/.yac/settings.toml and start YAC again.
#
# Shell environment variables named YAC_* override anything set here at
# startup, which is convenient for CI and per-shell experiments.
#
# Secrets: prefer OPENAI_API_KEY, ZAI_API_KEY, or stored OpenAI auth over
# placing a key in [provider].api_key below. For OpenAI, precedence is:
# env API key > stored OpenAI auth > inline settings API key.
# Store an OpenAI API key without shell history exposure:
#   printf 'sk-...' | yac auth openai set-api-key --stdin

temperature = 0.7
# system_prompt = "You are a helpful assistant."
# workspace_root = "/path/to/workspace"   # defaults to the launch directory

[provider]
id          = "openai-compatible"         # "openai-compatible", "openai", or "zai"
model       = "gpt-4o-mini"
base_url    = "https://api.openai.com/v1/"
api_key_env = "OPENAI_API_KEY"            # env var that holds the key
# api_key        = ""                     # optional; lowest priority for openai
# context_window = 0                      # override context window size (tokens); 0 = auto-detect

# OpenAI provider auth is opt-in: set provider.id = "openai" to use stored
# OpenAI auth or browser OAuth. With the default openai-compatible provider,
# OPENAI_API_KEY is used as a normal OpenAI-compatible API key.
#
# OpenAI auth options when provider.id = "openai":
# - Use OPENAI_API_KEY for the highest-priority API-key path.
# - Run `yac auth openai login` for browser OAuth.
# - Run `yac auth openai login --device` for device OAuth in headless shells.
# - Run `yac auth openai status` to see the effective source.
# - Run `yac auth openai logout` to clear stored OpenAI auth.
# Stored OpenAI auth is keychain-first, with file fallback at
# ~/.yac/provider/auth/openai.json.
# Set YAC_OPENAI_AUTH_STORE=file to skip keychain probing in headless/CI
# environments.

# OpenAI provider opt-in example.
# [provider]
# id          = "openai"
# model       = "gpt-4o-mini"
# base_url    = "https://api.openai.com/v1/"
# api_key_env = "OPENAI_API_KEY"

# Generic OpenAI-compatible endpoint example for other providers.
# [provider]
# id          = "openai-compatible"
# model       = "gpt-4o-mini"
# base_url    = "https://api.openai.com/v1/"
# api_key_env = "OPENAI_API_KEY"

# Z.ai preset example: uncomment to switch providers.
# Leaving model/base_url/api_key_env unset applies the built-in zai defaults
# (glm-5.1, https://api.z.ai/api/coding/paas/v4, ZAI_API_KEY).
# [provider]
# id = "zai"

# Bedrock provider: set id = "bedrock" to use AWS Bedrock (Converse API)
# Credentials: AWS SDK default chain (env vars, ~/.aws/credentials, IAM role, SSO)
# [provider]
# id          = "bedrock"
# model       = "anthropic.claude-3-5-haiku-20241022-v1:0"
# options.region             = "us-east-1"   # or set AWS_REGION / YAC_BEDROCK_REGION
# options.max_tokens         = "4096"
# options.profile            = ""            # AWS profile (optional)
# options.endpoint_override  = ""            # VPC endpoint (optional)
# options.credential_refresh_command = ""    # shell command to run on auth failure before retrying (e.g. "aws sso login --profile foo"); also settable via YAC_BEDROCK_CREDENTIAL_REFRESH_COMMAND

[lsp.clangd]
command = "clangd"
args    = []

[theme]
# Active theme preset. Built-in: "vivid" (default), "system".
# The "system" theme uses terminal default colors and
# disables OSC 11 background sync.
name = "vivid"

# Theme density: "comfortable" (default, normal spacing) or "compact"
# (tighter layout).
# density = "comfortable"

# Paint the terminal background to match the active theme's canvas
# color (via OSC 11) and restore the terminal default on exit. Has
# no effect when name = "system".
sync_terminal_background = true

[compact]
# Auto-compact the conversation history when projected prompt-token usage
# crosses `threshold` × the model's context window. Fired before each new
# user prompt; never splits a tool_call/tool_result pair.
auto_enabled = true
threshold    = 0.8                       # 0.05 .. 1.0
keep_last    = 20                        # most-recent messages to keep
mode         = "summarize"               # "summarize" (default) or "truncate"

[mcp]
# Maximum bytes for MCP tool result payloads (default: 262144 = 256 KB).
# result_max_bytes = 262144

# MCP server examples (all commented; uncomment to enable).
#
# Stdio example: Context7 via npx (requires Node.js).
# [[mcp.servers]]
# id = "context7"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@upstash/context7-mcp"]
# enabled = true
# auto_start = true
#
# HTTP+OAuth example: Generic OAuth2 server.
# [[mcp.servers]]
# id = "example-oauth"
# transport = "http"
# url = "https://mcp.example.com/api"
# enabled = true
# auto_start = false
# requires_approval = false
# [mcp.servers.auth]
# type = "oauth"
# authorization_url = "https://auth.example.com/authorize"
# token_url = "https://auth.example.com/token"
# client_id = "your-client-id"
# scopes = ["read", "write"]
